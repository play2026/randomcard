<script id="eyedropper-addon-script">
(() => {
  const EYE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 3 2 2-8.5 8.5-3-3L18 2.9A1.4 1.4 0 0 1 19 3Z"/><path d="m9.5 10.5-6.8 6.8a2.4 2.4 0 0 0-.7 1.7V22h3a2.4 2.4 0 0 0 1.7-.7l6.8-6.8"/></svg>';

  function setNativeValue(input, value) {
    const proto = Object.getPrototypeOf(input);
    const desc = Object.getOwnPropertyDescriptor(proto, 'value');
    if (desc && desc.set) desc.set.call(input, value); else input.value = value;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  }

  async function pickColor(input, btn) {
    if ('EyeDropper' in window && window.isSecureContext) {
      try {
        const result = await new EyeDropper().open();
        if (result && result.sRGBHex) setNativeValue(input, result.sRGBHex);
      } catch (err) {
        if (!err || err.name !== 'AbortError') console.warn('Eyedropper failed:', err);
      }
      return;
    }
    // Fallback for Safari/iPad/unsupported browsers: open the normal color picker.
    if (typeof input.showPicker === 'function') {
      try { input.showPicker(); return; } catch (_) {}
    }
    input.click();
  }

  function decorate(root = document) {
    root.querySelectorAll('input[type="color"]').forEach(input => {
      if (input.dataset.eyedropperReady === '1') return;
      input.dataset.eyedropperReady = '1';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rc-eyedropper-btn';
      btn.innerHTML = EYE_ICON;
      const realEyeDropper = 'EyeDropper' in window && window.isSecureContext;
      btn.title = realEyeDropper ? 'Pick a color from anywhere on the screen' : 'Screen eyedropper is not supported here; open the normal color picker';
      btn.setAttribute('aria-label', realEyeDropper ? 'Pick color from screen' : 'Open color picker');
      if (!realEyeDropper) btn.setAttribute('aria-disabled', 'true');
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        pickColor(input, btn);
      });
      input.insertAdjacentElement('afterend', btn);
    });
  }

  decorate();
  const observer = new MutationObserver(mutations => {
    for (const m of mutations) {
      for (const node of m.addedNodes) {
        if (node.nodeType === 1) decorate(node);
      }
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>

</body>
